name: brew test-bot

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  test-bot:
    # Skip drafts; marking the PR ready runs it.
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        # The formula installs prebuilt binaries, so test-bot just downloads +
        # tests one per platform (no compile, no bottling): macOS arm64, Linux
        # x86_64 + arm64. macOS x86_64 runs in `test-macos-intel` below.
        os: [ macos-26 ]
        include:
          - os: ubuntu-26.04
            container: ghcr.io/homebrew/brew:main
          - os: ubuntu-26.04-arm
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae

  test-macos-intel:
    # Intel macOS is Homebrew Tier 3: rebuilt core formulae get no Intel bottle,
    # so test-bot's own tooling (e.g. `brew style` -> shellcheck -> gmp) has to
    # build from source and breaks. Lint and audit are platform-independent and
    # already run in test-bot, so only install + test the x86_64 binary here.
    if: github.event.pull_request.draft == false
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew install --formula mergifyio/tap/mergify-cli

      - run: brew test mergifyio/tap/mergify-cli

  all-greens:
    name: all-greens
    if: ${{ !cancelled() }}
    needs:
      - test-bot
      - test-macos-intel
    runs-on: ubuntu-26.04
    steps:
      - name: Verify all jobs succeeded
        uses: Mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
          mergify_cli_version: latest
